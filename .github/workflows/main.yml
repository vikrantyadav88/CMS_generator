name: Build CMS Generator EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show repository contents
        shell: pwsh
        run: |
          Write-Host "Repository root: $env:GITHUB_WORKSPACE"
          Get-ChildItem -Force

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Locate CMS Generator source
        shell: pwsh
        run: |
          if (Test-Path "CMS_Generator_v0_13\main.py") {
            "APP_DIR=CMS_Generator_v0_13" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using extracted source folder: CMS_Generator_v0_13"
          }
          elseif (Test-Path "CMS_Generator_v0_13.zip") {
            New-Item -ItemType Directory -Force -Path "_cms_source" | Out-Null
            Expand-Archive -Path "CMS_Generator_v0_13.zip" -DestinationPath "_cms_source" -Force
            if (Test-Path "_cms_source\CMS_Generator_v0_13\main.py") {
              "APP_DIR=_cms_source\CMS_Generator_v0_13" | Out-File -FilePath $env:GITHUB_ENV -Append
              Write-Host "Using source extracted from CMS_Generator_v0_13.zip"
            }
            else {
              throw "The ZIP was found, but CMS_Generator_v0_13/main.py was not inside it."
            }
          }
          elseif (Test-Path "main.py") {
            "APP_DIR=." | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "Using repository root as the application directory."
          }
          else {
            throw "Could not find CMS_Generator_v0_13/main.py, CMS_Generator_v0_13.zip, or main.py at repository root."
          }

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # NumPy >= 2.4 requires x86-64-v2 instructions. Older laptops may lack them.
          # Pin the last pre-2.4 NumPy release for broader Windows x64 compatibility.
          python -m pip install pyinstaller cadquery pillow shapely "numpy==2.3.5"
          python -m pip check

      - name: Verify NumPy compatibility pin
        shell: pwsh
        run: |
          python -c "import numpy; print('NumPy version:', numpy.__version__); assert numpy.__version__ == '2.3.5', 'Unexpected NumPy version'"
          python -c "import cadquery, numpy; print('CadQuery import OK; NumPy', numpy.__version__)"

      - name: Build Windows application
        shell: pwsh
        run: |
          Set-Location $env:APP_DIR
          $dist = Join-Path $env:GITHUB_WORKSPACE "build_output"
          $work = Join-Path $env:RUNNER_TEMP "pyinstaller_work"

          python -m PyInstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name CMS_Generator `
            --distpath "$dist" `
            --workpath "$work" `
            --collect-all cadquery `
            --collect-all OCP `
            --collect-all shapely `
            --collect-all PIL `
            --add-data "assets;assets" `
            --add-data "presets;presets" `
            --add-data "examples;examples" `
            main.py

      - name: Verify executable exists
        shell: pwsh
        run: |
          $exe = Join-Path $env:GITHUB_WORKSPACE "build_output\CMS_Generator\CMS_Generator.exe"
          if (-not (Test-Path $exe)) {
            throw "Build completed but CMS_Generator.exe was not found."
          }
          Write-Host "Built successfully: $exe"

      - name: Record dependency versions
        shell: pwsh
        run: |
          python -m pip freeze | Out-File -Encoding utf8 -FilePath "build_output\CMS_Generator\build_requirements.txt"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CMS_Generator_Windows_v0_13
          path: build_output/CMS_Generator/
          if-no-files-found: error
